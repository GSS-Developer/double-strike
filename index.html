<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DOUBLE STRIKE｜宇宙シューティング</title><meta name="theme-color" content="#06132d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DOUBLE STRIKE"><meta name="description" content="10ステージの宇宙シューティング！スマホで遊べるDOUBLE STRIKE"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><meta property="og:type" content="website"><meta property="og:title" content="DOUBLE STRIKE｜宇宙シューティング"><meta property="og:description" content="10ステージを突破してボスを倒そう！iPhone・Androidで遊べる無料ゲーム"><meta property="og:image" content="https://USERNAME.github.io/double-strike/share.png"><meta name="twitter:card" content="summary_large_image"><style>html,body{margin:0;background:#020611;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 2px 4px black;pointer-events:none}#pauseBtn{position:fixed;top:54px;right:8px;z-index:5;display:none;width:28px;height:28px;padding:0;border-radius:50%;font-size:14px;line-height:1;background:#07152288;border:1px solid #8db1c055;color:#d9f6ff;opacity:.7;box-shadow:none}#overlay{position:fixed;inset:0;background:#010616cc;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}button{font-size:20px;padding:14px 34px;border-radius:12px;border:1px solid #77ddff;background:#104b70;color:white;font-weight:bold}small{opacity:.75;line-height:1.8}</style></head><body><canvas id="c"></canvas><div id="ui"><span id="score">SCORE 0</span><span id="wave">WAVE 1</span><span id="hp">♥♥♥</span></div><button id="pauseBtn" aria-label="一時停止" title="一時停止">⏸</button><div id="overlay"><h1>DOUBLE STRIKE</h1><p>最初からダブルショット！<br>高速ダブルショットで敵編隊を撃ち落とせ！<br>各ステージで敵編隊を倒すとボス登場！<br>ボス撃破で次のステージへ！</p><button id="start">START ▶</button><p><small>スマホ：画面を指で上下左右に動かす<br>PC：矢印キー / WASDで上下左右に移動<br>射撃は自動／右上ボタンで一時停止<br>PC：Pキーでも一時停止</small></p></div><script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),ui={score:document.getElementById('score'),wave:document.getElementById('wave'),hp:document.getElementById('hp')},overlay=document.getElementById('overlay');let W=0,H=0,dpr=1,ship=0,shipY=0,target=null,targetY=null,keys={},bullets=[],foes=[],enemyBullets=[],particles=[],stars=[],score=0,wave=1,hp=3,lives=3,playing=false,spawn=0,shot=0,elapsed=0,invuln=0,shake=0,last=0,boss=null,bossWave=0,bossBanner=0,stageKills=0,phase="normal",phaseWait=0,paused=false,finished=false;const pauseBtn=document.getElementById("pauseBtn");function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);ship=W/2;shipY=H*.82;stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,s:20+Math.random()*55}));}addEventListener('resize',resize);resize();const rnd=(a,b)=>a+Math.random()*(b-a);function boom(x,y,col,n=13){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rnd(50,210);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.25,.65),life:.65,col});}}function start(){score=0;wave=1;hp=3;lives=3;bullets=[];foes=[];enemyBullets=[];particles=[];spawn=0;shot=0;elapsed=0;invuln=0;boss=null;bossWave=0;bossBanner=0;stageKills=0;phase="normal";phaseWait=0;paused=false;finished=false;playing=true;pauseBtn.style.display="block";pauseBtn.textContent="⏸";pauseBtn.setAttribute("aria-label","一時停止");overlay.querySelector("h1").textContent="DOUBLE STRIKE";overlay.querySelector("p").innerHTML="最初からダブルショット！<br>各ステージのボスを撃破して10面クリアを目指せ！";overlay.style.display='none';ship=W/2;shipY=H*.82;target=null;targetY=null;}document.getElementById('start').onclick=start;function togglePause(){if(!playing||finished)return;paused=!paused;pauseBtn.textContent=paused?'▶':'⏸';pauseBtn.setAttribute('aria-label',paused?'再開':'一時停止');}pauseBtn.onclick=togglePause;addEventListener('keydown',e=>{if(e.code==='KeyP'||e.code==='Escape'){if(!e.repeat)togglePause();e.preventDefault();return;}keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('pointerdown',e=>{target=e.clientX;targetY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(e.buttons){target=e.clientX;targetY=e.clientY}});c.addEventListener('pointerup',()=>{target=null;targetY=null});function addEnemy(){let side=Math.random()<.5?-1:1,x=side<0?-28:W+28;let type=Math.random()<Math.min(.15+wave*.03,.45)?1:0;foes.push({x,y:rnd(55,Math.max(95,H*.35)),base:rnd(45,Math.max(80,H*.37)),vx:-side*rnd(85,135)*(1+wave*.08),t:0,type,hp:type?2:1,fire:rnd(1.1,3.3),size:type?20:16});}function update(dt){stars.forEach(s=>{s.y+=s.s*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});particles=particles.filter(p=>(p.x+=p.vx*dt,p.y+=p.vy*dt,p.vx*=.98,p.vy*=.98,p.t-=dt,p.t>0));if(!playing||paused)return;elapsed+=dt;invuln=Math.max(0,invuln-dt);shake=Math.max(0,shake-dt);if(keys.ArrowLeft||keys.KeyA)ship-=330*dt;if(keys.ArrowRight||keys.KeyD)ship+=330*dt;if(keys.ArrowUp||keys.KeyW)shipY-=330*dt;if(keys.ArrowDown||keys.KeyS)shipY+=330*dt;if(target!==null)ship+=(target-ship)*Math.min(1,dt*15);if(targetY!==null)shipY+=(targetY-shipY)*Math.min(1,dt*15);ship=Math.max(22,Math.min(W-22,ship));shipY=Math.max(H*.34,Math.min(H-38,shipY));shot-=dt;if(shot<=0){shot=.075;for(const dx of [-12,12])bullets.push({x:ship+dx,y:shipY-15,vy:-640});}spawn-=dt;if(spawn<=0&&phase==="normal"){spawn=Math.max(.28,.82-wave*.04);addEnemy();}if(phase==="normal"&&stageKills>=12+wave*4){phase="preboss";phaseWait=2.3;foes=[];enemyBullets=[];bossBanner=2.3;}
if(phase==="preboss"){phaseWait-=dt;if(phaseWait<=0){phase="boss";boss={x:W/2,y:-90,hp:35+wave*15,maxhp:35+wave*15,t:0,fire:1.5};bossBanner=2.5;}}
if(phase==="clear"){phaseWait-=dt;if(phaseWait<=0){if(wave>=10){finished=true;playing=false;pauseBtn.style.display='none';overlay.style.display='flex';overlay.querySelector('h1').textContent='🏆 10 STAGES CLEAR!';overlay.querySelector('p').innerHTML='全10ステージ制覇！<br>おめでとう！ 宇宙の平和を守った！<br>FINAL SCORE '+score;document.getElementById('start').textContent='もう一度プレイ ▶';return;}wave++;lives=3;hp=3;invuln=2;stageKills=0;phase="normal";spawn=0;enemyBullets=[];bullets=[];bossBanner=2;}}
bossBanner=Math.max(0,bossBanner-dt);if(boss){let z=boss;z.t+=dt;z.x=W/2+Math.sin(z.t*.95)*Math.min(W*.32,150);z.y+=(Math.min(105,H*.2)-z.y)*Math.min(1,dt*1.8);z.fire-=dt;if(z.fire<=0){z.fire=.95;for(let k=-2;k<=2;k++){let a=Math.PI/2+k*.23;enemyBullets.push({x:z.x,y:z.y+45,vx:Math.cos(a)*175,vy:Math.sin(a)*175});}}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.abs(b.x-z.x)<66&&Math.abs(b.y-z.y)<50){bullets.splice(j,1);z.hp--;boom(b.x,b.y,'#ffcf55',2);if(z.hp<=0){score+=700;boom(z.x,z.y,'#ff9d38',90);boss=null;shake=.35;bossBanner=3;phase='clear';phaseWait=3.2;foes=[];enemyBullets=[];}break;}}}bullets=bullets.filter(b=>(b.y+=b.vy*dt,b.y>-20));enemyBullets=enemyBullets.filter(b=>(b.y+=b.vy*dt,b.x+=b.vx*dt,b.y<H+20));for(let i=foes.length-1;i>=0;i--){let f=foes[i];f.t+=dt;f.x+=f.vx*dt;f.y=f.base+Math.sin(f.t*3)*28+Math.sin(elapsed*.7+f.base)*10;f.fire-=dt;if(f.fire<=0){f.fire=rnd(1.4,3.2);let dx=ship-f.x,dy=shipY-f.y,len=Math.hypot(dx,dy)||1;enemyBullets.push({x:f.x,y:f.y,vx:dx/len*135,vy:dy/len*135});}if(f.x<-70||f.x>W+70){foes.splice(i,1);continue;}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.abs(b.x-f.x)<f.size&&Math.abs(b.y-f.y)<f.size){bullets.splice(j,1);f.hp--;boom(b.x,b.y,'#ffd36e',4);if(f.hp<=0){score+=f.type?40:20;stageKills++;boom(f.x,f.y,f.type?'#ff65bd':'#4deaff');foes.splice(i,1);shake=.09;}break;}}}for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];if(invuln<=0&&Math.abs(b.x-ship)<19&&Math.abs(b.y-shipY)<20){enemyBullets.splice(i,1);hp--;invuln=1.3;shake=.25;boom(ship,shipY,'#ff6e5d',24);if(hp<=0){lives--;if(lives>0){hp=3;invuln=2.5;ship=W/2;shipY=H*.82;enemyBullets=[];boom(ship,shipY,'#8dfaff',25);}else{playing=false;pauseBtn.style.display='none';overlay.style.display='flex';overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelector('p').innerHTML='SCORE '+score+'<br>STAGE '+wave;document.getElementById('start').textContent='RETRY ▶';}}break;}}ui.score.textContent='SCORE '+score;ui.wave.textContent='STAGE '+wave+'  '+(phase==='normal'?stageKills+'/'+(12+wave*4):phase==='boss'?'BOSS':phase==='clear'?'CLEAR':'WARNING');ui.hp.textContent='機体 '+lives+'/3  耐久 '+'♥'.repeat(Math.max(0,hp));}function render(){g.fillStyle='#020611';g.fillRect(0,0,W,H);g.save();if(shake)g.translate(rnd(-3,3),rnd(-3,3));for(const s of stars){g.fillStyle='#b9e5ff';g.globalAlpha=.3+s.r*.3;g.fillRect(s.x,s.y,s.r,s.r*2);}g.globalAlpha=1;let grad=g.createLinearGradient(0,H*.5,0,H);grad.addColorStop(0,'#06152a00');grad.addColorStop(1,'#092c52');g.fillStyle=grad;g.fillRect(0,H*.5,W,H*.5);for(const b of bullets){g.fillStyle='#78f8ff';g.shadowColor='#4deaff';g.shadowBlur=12;g.fillRect(b.x-3,b.y-15,6,20);g.shadowBlur=0;}for(const b of enemyBullets){g.fillStyle='#ff7867';g.beginPath();g.arc(b.x,b.y,5,0,Math.PI*2);g.fill();}if(boss){let z=boss;g.save();g.translate(z.x,z.y);g.shadowColor='#ff3f7c';g.shadowBlur=24;g.fillStyle='#8c264a';g.beginPath();g.moveTo(0,-52);g.lineTo(37,-34);g.lineTo(72,0);g.lineTo(53,30);g.lineTo(21,21);g.lineTo(0,48);g.lineTo(-21,21);g.lineTo(-53,30);g.lineTo(-72,0);g.lineTo(-37,-34);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#26132c';g.fillRect(-28,-18,56,35);g.fillStyle='#ffdf5b';for(let i=-1;i<=1;i++)g.fillRect(i*23-5,-8,10,14);g.restore();g.fillStyle='#3a1829';g.fillRect(W*.12,47,W*.76,12);g.fillStyle='#ff4877';g.fillRect(W*.12,47,W*.76*Math.max(0,z.hp/z.maxhp),12);g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='center';g.fillText('BOSS  巨大宇宙戦艦',W/2,40);g.textAlign='left';}if(bossBanner>0){g.fillStyle='#ffb64e';g.font='bold 28px system-ui';g.textAlign='center';g.fillText(phase==='preboss'?'WARNING! BOSS':phase==='clear'?'STAGE CLEAR!':phase==='boss'?'WARNING! BOSS':'STAGE '+wave,W/2,H*.38);g.textAlign='left';}for(const f of foes){g.save();g.translate(f.x,f.y);g.fillStyle=f.type?'#e94e9d':'#39bce0';g.shadowColor=g.fillStyle;g.shadowBlur=12;g.beginPath();g.moveTo(0,16);g.lineTo(-f.size,0);g.lineTo(-f.size*.7,-12);g.lineTo(0,-5);g.lineTo(f.size*.7,-12);g.lineTo(f.size,0);g.closePath();g.fill();g.fillStyle='#091020';g.fillRect(-5,-2,10,6);g.restore();}for(const p of particles){g.globalAlpha=Math.max(0,p.t/p.life);g.fillStyle=p.col;g.fillRect(p.x-2,p.y-2,4,4);}g.globalAlpha=1;if(playing&&(invuln<=0||Math.floor(invuln*12)%2===0)){g.save();g.translate(ship,shipY);g.fillStyle='#73eaff';g.shadowColor='#1bd5ff';g.shadowBlur=18;g.beginPath();g.moveTo(0,-24);g.lineTo(-19,17);g.lineTo(-9,12);g.lineTo(0,17);g.lineTo(9,12);g.lineTo(19,17);g.closePath();g.fill();g.fillStyle='#15374b';g.fillRect(-5,-8,10,16);g.fillStyle='#ff9a38';g.fillRect(-11,18,6,12+Math.random()*8);g.fillRect(5,18,6,12+Math.random()*8);g.restore();}g.restore();if(paused){g.fillStyle='#000a';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff';g.font='bold 38px system-ui';g.fillText('PAUSED',W/2,H*.45);g.font='17px system-ui';g.fillText('右上の ▶ で再開',W/2,H*.45+36);g.textAlign='left';}}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);})();
</script></body></html>
